<script>
let nums=[],usedButtons=[],cachedSolutions=null;
let timer=null,timerSeconds=30,timerLeft=timerSeconds;
let cardMode="number"; // number / poker

const suits=["hearts","diamonds","clubs","spades"];

function cardLabel(n){
  if(n===1) return "A";
  if(n===11) return "J";
  if(n===12) return "Q";
  if(n===13) return "K";
  return n.toString();
}

function randomCardImage(n){
  const suit=suits[Math.floor(Math.random()*4)];
  return `/cards/${suit}/${cardLabel(n)}.png`;
}

function toggleCardMode(){
  cardMode=(cardMode==="number")?"poker":"number";
  renderNums();  // 只更新题目区
}

function renderNums(){
  const area=document.getElementById("numArea");
  area.innerHTML="";
  nums.forEach((n,i)=>{
    const btn=document.createElement("button");
    btn.className="num-btn";
    btn.dataset.index=i;
    if(cardMode==="number"){
      btn.textContent=n;
    }else{
      const img=document.createElement("img");
      img.src=randomCardImage(n);
      img.style.width="60px";
      img.style.height="80px";
      img.style.borderRadius="6px";
      img.style.boxShadow="0 2px 6px rgba(0,0,0,0.2)";
      btn.appendChild(img);
    }
    btn.onclick=()=>useNumber(btn,n);
    area.appendChild(btn);
  });
}

function useNumber(btn,n){
  if(btn.classList.contains("disabled")) return;
  insertOp(n);
  btn.classList.add("disabled");
  usedButtons.push(btn);
}

function undo(){
  const e=document.getElementById("expr");
  if(usedButtons.length===0) return;
  e.value=e.value.replace(/\d+$/,"");
  const btn=usedButtons.pop();
  btn.classList.remove("disabled");
}

//🎯 按钮插入逻辑永远在“末尾追加”，不会根据光标位置插入的补丁修复
function insertOp(op){
  const input = document.getElementById("expr");

  // 先确保输入框获得焦点
  input.focus();

  const start = input.selectionStart;
  const end = input.selectionEnd;
  const old = input.value;

  // 在当前选区（光标位置）插入 op，并把光标放到插入内容后面
  input.setRangeText(op, start, end, "end");
}

function clearExpr(){
  document.getElementById("expr").value="";
  document.getElementById("status").innerHTML="";
}

function setStatus(msg,type){
  const s=document.getElementById("status");
  s.textContent=msg;
  s.className=type;
}

function firework(){
  for(let i=0;i<8;i++){
    const fw=document.createElement("div");
    fw.className="firework";
    fw.style.left=(Math.random()*window.innerWidth)+"px";
    fw.style.top=(Math.random()*window.innerHeight)+"px";
    document.body.appendChild(fw);
    setTimeout(()=>fw.remove(),800);
  }
}

function startTimer(){
  timerLeft=timerSeconds;
  updateTimerBar();
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    timerLeft--;
    updateTimerBar();
    if(timerLeft<=0){
      clearInterval(timer);
      setStatus("⏰ 时间到！请换一题","err");
    }
  },1000);
}

function updateTimerBar(){
  const bar=document.getElementById("timerInner");
  bar.style.width=(timerLeft/timerSeconds*100)+"%";
}

function checkExpr(){
  const raw=document.getElementById("expr").value;
  const expr=raw.replace(/×/g,"*").replace(/÷/g,"/");
  if(!expr.trim()){
    setStatus("请输入算式","err");
    return;
  }
  const used=expr.match(/\d+/g)?.map(x=>parseInt(x))||[];
  const sortedUsed=used.slice().sort((a,b)=>a-b);
  const sortedNums=nums.slice().sort((a,b)=>a-b);
  if(JSON.stringify(sortedUsed)!==JSON.stringify(sortedNums)){
    setStatus("必须使用题目给出的四个数字","err");
    return;
  }
  try{
    const val=Function("return ("+expr+")")();
    if(Math.abs(val-24)<1e-9){
      setStatus("🎉 正确！结果是 24","ok");
      firework();
    }else{
      setStatus("结果是 "+val+"，不是 24","err");
    }
  }catch{
    setStatus("表达式错误，请检查括号与运算符","err");
  }
}

function solve24All(){
  if(cachedSolutions) return cachedSolutions;
  const ops=["+","-","*","/"];
  const results=new Set();
  function calc(a,b,op){
    if(op==="+") return a+b;
    if(op==="-") return a-b;
    if(op==="*") return a*b;
    if(op==="/") return b===0?null:a/b;
  }
  const arr=nums.slice();
  const perms=[];
  for(let i=0;i<4;i++){
    for(let j=0;j<4;j++){
      if(j===i) continue;
      for(let k=0;k<4;k++){
        if(k===i||k===j) continue;
        for(let l=0;l<4;l++){
          if(l===i||l===j||l===k) continue;
          perms.push([arr[i],arr[j],arr[k],arr[l]]);
        }
      }
    }
  }
  for(const [a,b,c,d] of perms){
    for(const op1 of ops){
      for(const op2 of ops){
        for(const op3 of ops){

          let t1=calc(a,b,op1);
          if(t1!==null){
            let t2=calc(t1,c,op2);
            if(t2!==null){
              let t3=calc(t2,d,op3);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`((${a}${op1}${b})${op2}${c})${op3}${d}`);
            }
          }

          t1=calc(b,c,op2);
          if(t1!==null){
            let t2=calc(a,t1,op1);
            if(t2!==null){
              let t3=calc(t2,d,op3);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`(${a}${op1}(${b}${op2}${c}))${op3}${d}`);
            }
          }

          t1=calc(b,c,op2);
          if(t1!==null){
            let t2=calc(t1,d,op3);
            if(t2!==null){
              let t3=calc(a,t2,op1);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`${a}${op1}((${b}${op2}${c})${op3}${d})`);
            }
          }

          t1=calc(c,d,op3);
          if(t1!==null){
            let t2=calc(b,t1,op2);
            if(t2!==null){
              let t3=calc(a,t2,op1);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`${a}${op1}(${b}${op2}(${c}${op3}${d}))`);
            }
          }

          t1=calc(a,b,op1);
          t2=calc(c,d,op3);
          if(t1!==null&&t2!==null){
            let t3=calc(t1,t2,op2);
            if(t3!==null&&Math.abs(t3-24)<1e-9)
              results.add(`(${a}${op1}${b})${op2}(${c}${op3}${d})`);
          }
        }
      }
    }
  }
  cachedSolutions=[...results].map(s=>s.replace(/\*/g,"×").replace(/\//g,"÷"));
  updateDifficulty(cachedSolutions.length);
  return cachedSolutions;
}

function updateDifficulty(count){
  const tag=document.getElementById("difficultyTag");
  let level="";
  if(count===0) level="❌ 无解题";
  else if(count<=2) level="⭐ 简单";
  else if(count<=6) level="⭐⭐ 中等";
  else if(count<=15) level="⭐⭐⭐ 困难";
  else level="⭐⭐⭐⭐ 地狱级";
  tag.textContent=level;
}

function showAiExplain(){
  const div=document.getElementById("aiExplain");
  const sols=solve24All();
  if(sols.length===0){
    div.innerHTML="❌ 这组数字无解。";
    return;
  }
  const sample=sols.slice(0,Math.min(3,sols.length));
  div.innerHTML=`<p>这道题可以这样思考：</p>
    <ul>${sample.map(s=>`<li><code>${s}</code></li>`).join("")}</ul>`;
}

function showAllSolutions(){
  const sols=solve24All();
  const list=document.getElementById("answerList");
  list.innerHTML="";
  if(sols.length===0){
    list.innerHTML="❌ 本题无解";
    return;
  }
  sols.forEach(a=>{
    const div=document.createElement("div");
    div.textContent=a;
    list.appendChild(div);
  });
}

function shareProblem(){
  const difficulty=document.getElementById("difficultyTag").textContent;
  const numbers=nums.join(", ");
  const text=`24点题目：${numbers} 难度：${difficulty}`;
  const area=document.getElementById("qrcodeArea");
  area.innerHTML="";
  const img=document.createElement("img");
  img.src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="+encodeURIComponent(text);
  img.style.marginTop="10px";
  img.style.borderRadius="6px";
  area.appendChild(img);
}

function newQuestion(){
  nums=[];
  for(let i=0;i<4;i++) nums.push(Math.floor(Math.random()*13)+1);
  usedButtons=[];
  cachedSolutions=null;
  renderNums();
  document.getElementById("expr").value="";
  document.getElementById("status").innerHTML="";
  document.getElementById("aiExplain").innerHTML="";
  document.getElementById("answerList").innerHTML="（尚未计算）";
  startTimer();
  solve24All();

window.onload=function(){
  newQuestion();
};

// 手写板初始化
const handCanvas = document.getElementById("handCanvas");
const handCtx = handCanvas.getContext("2d");
let drawing = false;

function getCanvasPos(e){
  const rect = handCanvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x, y };
}

function startDraw(e){
  drawing = true;
  const { x, y } = getCanvasPos(e);
  handCtx.beginPath();
  handCtx.moveTo(x, y);
}

function moveDraw(e){
  if(!drawing) return;
  const { x, y } = getCanvasPos(e);
  handCtx.lineTo(x, y);
  //handCtx.strokeStyle = "#000";
  handCtx.strokeStyle = "white";
  //handCtx.lineWidth = 4;
  handCtx.lineWidth = 12;
  handCtx.lineCap = "round";
  handCtx.lineJoin = "round";
  handCtx.stroke();
}

function endDraw(){
  drawing = false;
}

handCanvas.addEventListener("mousedown", startDraw);
handCanvas.addEventListener("mousemove", moveDraw);
handCanvas.addEventListener("mouseup", endDraw);
handCanvas.addEventListener("mouseleave", endDraw);

// 触屏支持
handCanvas.addEventListener("touchstart", e => { e.preventDefault(); startDraw(e); });
handCanvas.addEventListener("touchmove",  e => { e.preventDefault(); moveDraw(e); });
handCanvas.addEventListener("touchend",   e => { e.preventDefault(); endDraw(); });

function clearHandCanvas(){
  handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);
}

function preprocessHandCanvas() {
    const src = handCanvas;
    const ctx = handCtx;

    const W = src.width;
    const H = src.height;

    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    // 1. 找所有白色像素
    let minX = W, minY = H;
    let maxX = 0, maxY = 0;

    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            if (r + g + b > 50) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }
    
    // ⭐⭐ 必须保留：没有笔迹时直接返回空图
    if (maxX <= minX || maxY <= minY) {
        return tf.zeros([1, 784]);
    }
    
    // ⭐⭐ 方案2：扩大裁剪区域（关键）
    minX -= 10;
    maxX += 10;
    minY -= 10;
    maxY += 10;

    // ⭐ 防止越界
    minX = Math.max(0, minX);
    minY = Math.max(0, minY);
    maxX = Math.min(W - 1, maxX);
    maxY = Math.min(H - 1, maxY);

    // ⭐ 继续你的裁剪逻辑
    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;

    let cropCanvas = document.createElement("canvas");
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    let cropCtx = cropCanvas.getContext("2d");
    cropCtx.drawImage(src, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

    let small = document.createElement("canvas");
    small.width = 20;
    small.height = 20;
    let smallCtx = small.getContext("2d");
    smallCtx.imageSmoothingEnabled = false;
    
    //smallCtx.drawImage(cropCanvas, 0, 0, 20, 20);
    const scale = Math.min(20 / cropW, 20 / cropH);
    const newW = cropW * scale;
    const newH = cropH * scale;
    smallCtx.drawImage(cropCanvas, 0, 0, newW, newH);


    let dst = document.createElement("canvas");
    dst.width = 28;
    dst.height = 28;
    let dstCtx = dst.getContext("2d");
    dstCtx.imageSmoothingEnabled = false;

    dstCtx.fillStyle = "black";
    dstCtx.fillRect(0, 0, 28, 28);

    const offsetX = 4;
    const offsetY = 4;
    dstCtx.drawImage(small, offsetX, offsetY);

    const finalData = dstCtx.getImageData(0, 0, 28, 28).data;
    let arr = [];
    for (let i = 0; i < finalData.length; i += 4) {
        let gray = (finalData[i] + finalData[i+1] + finalData[i+2]) / 3 / 255;
        arr.push(gray);
    }

    return tf.tensor(arr).reshape([1, 784]);
}

function splitDigits() {
    const W = handCanvas.width;
    const H = handCanvas.height;
    const ctx = handCtx;

    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    // 生成二值图
    let mask = Array.from({length: H}, () => Array(W).fill(0));
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            const i = (y * W + x) * 4;
            const r = data[i], g = data[i+1], b = data[i+2];
            mask[y][x] = (r + g + b > 50) ? 1 : 0;
        }
    }

    // 连通区域
    let visited = Array.from({length: H}, () => Array(W).fill(false));
    let components = [];

    function bfs(sx, sy) {
        let queue = [[sx, sy]];
        visited[sy][sx] = true;

        let minX = sx, maxX = sx;
        let minY = sy, maxY = sy;

        while (queue.length > 0) {
            let [x, y] = queue.shift();
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
                    if (!visited[ny][nx] && mask[ny][nx] === 1) {
                        visited[ny][nx] = true;
                        queue.push([nx, ny]);

                        if (nx < minX) minX = nx;
                        if (nx > maxX) maxX = nx;
                        if (ny < minY) minY = ny;
                        if (ny > maxY) maxY = ny;
                    }
                }
            }
        }

        return {minX, maxX, minY, maxY};
    }

    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            if (mask[y][x] === 1 && !visited[y][x]) {
                components.push(bfs(x, y));
            }
        }
    }

    // 按 X 排序
    components.sort((a, b) => a.minX - b.minX);

    return components;
}

function preprocessSingleDigit(minX, maxX, minY, maxY) {
    const cropW = maxX - minX + 1;
    const cropH = maxY - minY + 1;

    let cropCanvas = document.createElement("canvas");
    cropCanvas.width = cropW;
    cropCanvas.height = cropH;
    let cropCtx = cropCanvas.getContext("2d");

    cropCtx.drawImage(handCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

    let small = document.createElement("canvas");
    small.width = 20;
    small.height = 20;
    let smallCtx = small.getContext("2d");
    smallCtx.imageSmoothingEnabled = false;
    smallCtx.drawImage(cropCanvas, 0, 0, 20, 20);

    let dst = document.createElement("canvas");
    dst.width = 28;
    dst.height = 28;
    let dstCtx = dst.getContext("2d");
    dstCtx.imageSmoothingEnabled = false;

    dstCtx.fillStyle = "black";
    dstCtx.fillRect(0, 0, 28, 28);
    dstCtx.drawImage(small, 4, 4);

    const finalData = dstCtx.getImageData(0, 0, 28, 28).data;
    let arr = [];
    for (let i = 0; i < finalData.length; i += 4) {
        let gray = (finalData[i] + finalData[i+1] + finalData[i+2]) / 3 / 255;
        arr.push(gray);
    }

    return tf.tensor(arr).reshape([1, 784]);
}

async function recognizeMultipleDigits() {
    const comps = splitDigits();
    let result = "";

    for (let comp of comps) {
        const input = preprocessSingleDigit(comp.minX, comp.maxX, comp.minY, comp.maxY);
        const pred = mnistModel.predict(input).argMax(1).dataSync()[0];
        result += pred.toString();
    }

    return result;
}
