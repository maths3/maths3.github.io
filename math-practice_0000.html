<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学1年级 乘除法算数练习</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .controls {
            display: flex !important;
            justify-content: space-between !important;
            margin-bottom: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .submit-btn {
            background-color: #008CBA;
        }
        .submit-btn:hover {
            background-color: #007bb5;
        }
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .quiz-item {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 8px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
        }
        .quiz-item input {
            width: 42px;
            height: 25px;
            font-size: 15px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .quiz-item input.correct {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }
        .quiz-item input.incorrect {
            border-color: #f44336;
            background-color: #ffebee;
        }
        .score-board {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
        }        
        /* ============================================================
         * 数字のはみ出し解消 & 端末別最適化CSS
         * ============================================================ */

        /* 1. タイトルテキストの不自然な改行を防ぐ */
        h1, h2, .title {
          word-break: keep-all !important;
          white-space: nowrap !important;
        }

        /* 2. 上部ボタンの余白と位置調整 */
        .button-container,
        .top-buttons,
        div:has(> button) {
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          gap: 16px !important;                     /* ボタン同士の横間隔 */
          margin: 16px auto 20px auto !important;
        }

        .btn,
        button,
        input[type="button"] {
          height: 38px !important;
          padding: 0 18px !important;
          font-size: 0.92rem !important;
          font-weight: 600 !important;
          border-radius: 8px !important;
          border: none !important;
          cursor: pointer !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          white-space: nowrap !important;
        }

        /* 3. 問題カード：はみ出しを防止し、内側に収める */
        .item,
        div[class*="item"] {
          display: flex !important;
          justify-content: space-between !important; /* 左に数式、右に入力枠を配置 */
          align-items: center !important;
          gap: 8px !important;
          width: 100% !important;
          max-width: 100% !important;                /* 固定幅を解除してカード枠を広げる */
          padding: 8px 12px !important;              /* 内側余白を確保 */
          box-sizing: border-box !important;         /* paddingを含めたサイズ計算 */
          overflow: hidden !important;               /* はみ出しを完全にカット */
        }

        /* 算式テキスト（81 ÷ 9 = など） */
        .item span,
        div[class*="item"] span {
          margin: 0 !important;
          padding: 0 !important;
          flex: 1 !important;                        /* 左側スペースを自動確保 */
          min-width: 0 !important;                   /* 幅の自動縮小を許可してはみ出し防止 */
          font-size: 1.05rem !important;
          font-weight: 700 !important;
          text-align: left !important;               /* 左揃え */
          white-space: nowrap !important;            /* 改行させない */
        }

        /* 入力ボックス */
        .item input,
        div[class*="item"] input {
          margin: 0 !important;
          flex: none !important;                     /* サイズを固定 */
          width: 46px !important;                    /* コンパクトな方格サイズ */
          height: 34px !important;
          text-align: center !important;
          font-size: 1rem !important;
          box-sizing: border-box !important;
        }

        /* 4. 全体グリッドレイアウト（レスポンシブ対応） */
        #problemsContainer,
        .problems-grid,
        .grid {
          display: grid !important;
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important; /* PC・タブレットで2列均等 */
          gap: 10px 12px !important;                                    /* カード同士の間隔 */
          width: 100% !important;
          max-width: 520px !important;                                  /* 全体の最大幅 */
          margin: 0 auto !important;
          padding: 0 12px !important;
          box-sizing: border-box !important;
        }

        /* 5. モバイル（スマホ）画面向けの自動1列切り替え */
        @media screen and (max-width: 480px) {
          #problemsContainer,
          .problems-grid,
          .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important; /* スマホでも2列で綺麗に収まります */
            gap: 8px 8px !important;
            padding: 0 8px !important;
          }

          .item,
          div[class*="item"] {
            padding: 6px 8px !important;             /* スマホ用内側余白微調整 */
          }

          .item span,
          div[class*="item"] span {
            font-size: 0.95rem !important;           /* スマホ用に文字サイズを最適化 */
          }

          .item input,
          div[class*="item"] input {
            width: 42px !important;                  /* スマホ用の入力枠サイズ */
            height: 32px !important;
          }
    </style>
</head>
<body>

<div class="container">
    <h1>小学1年级 乘除练习</h1>
    <div class="controls">
        <button onclick="generateQuiz()">刷新题目</button>
        <button class="submit-btn" onclick="checkAnswers()">提交答案</button>
    </div>

    <div id="quiz" class="quiz-grid"></div>

    <div id="score" class="score-board"></div>
</div>

<script>
    let currentQuestions = [];

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuiz() {
        const quizContainer = document.getElementById('quiz');
        const scoreDiv = document.getElementById('score');
        quizContainer.innerHTML = '';
        scoreDiv.innerHTML = '';
        currentQuestions = [];

        for (let i = 0; i < 10; i++) {
            const isMultiplication = Math.random() > 0.5;
            let num1, num2, symbol, answer;

            if (isMultiplication) {
                num1 = getRandomInt(1, 9);
                num2 = getRandomInt(1, 9);
                symbol = '×';
                answer = num1 * num2;
            } else {
                num2 = getRandomInt(1, 9);
                answer = getRandomInt(1, 9);
                num1 = num2 * answer;
                symbol = '÷';
            }

            currentQuestions.push({ num1, num2, symbol, answer });

            const itemDiv = document.createElement('div');
            itemDiv.className = 'quiz-item';
            itemDiv.innerHTML = `
                <!-- <span>${i + 1}. ${num1} ${symbol} ${num2} = </span> -->
                <span>${num1} ${symbol} ${num2} = </span>
                <input type="number" id="ans-${i}" />
            `;
            quizContainer.appendChild(itemDiv);
        }
    }

    function checkAnswers() {
        let correctCount = 0;
        currentQuestions.forEach((q, index) => {
            const input = document.getElementById(`ans-${index}`);
            const userAnswer = parseInt(input.value, 10);

            input.classList.remove('correct', 'incorrect');
            if (userAnswer === q.answer) {
                correctCount++;
                input.classList.add('correct');
            } else {
                input.classList.add('incorrect');
            }
        });

        const scoreDiv = document.getElementById('score');
        scoreDiv.innerHTML = `得分：${correctCount * 10} / 100 点 (正确率 ${correctCount}/${currentQuestions.length})`;
    }

    // 页面加载时自动生成题目
    window.onload = generateQuiz;
</script>

</body>
</html>
