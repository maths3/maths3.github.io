<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🎈 数学乐园 · 小学 1～6 年级 · 方格填数闯关系统（最终整合版 · 含题目描述）</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #fffaf0;
  margin: 0;
  padding: 20px;
}
h1 {
  text-align:center;
  color:#ff9800;
  margin-bottom:10px;
}
.grade-select {
  text-align:center;
  margin-top:10px;
}
.grade-btn {
  display:inline-block;
  padding:6px 12px;
  margin:4px;
  background:#2196f3;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}
.grade-btn.active {
  background:#ff9800;
}
#levelTitle {
  text-align:center;
  margin-top:10px;
  font-size:20px;
}
#progressArea {
  text-align:center;
  margin-top:10px;
  font-size:14px;
}
.progress-bar-wrap {
  width:60%;
  margin:6px auto;
  height:10px;
  background:#eee;
  border-radius:5px;
  overflow:hidden;
}
.progress-bar-inner {
  height:100%;
  width:0%;
  background:#4caf50;
}
#statsArea {
  text-align:center;
  margin-top:6px;
  font-size:13px;
}
#questionDesc {
  text-align:center;
  margin-top:15px;
  font-size:16px;
  color:#333;
}
.board {
  text-align:center;
  margin-top:20px;
  position:relative;
}
.eq-row {
  font-size: 28px;
  margin: 20px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
.square {
  width: 48px;
  height: 48px;
  border: 2px solid #333;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  font-weight: bold;
  background: #ffffff;
}
.op {
  font-size:28px;
}
.num-panel {
  text-align:center;
  margin-top:20px;
}
.num-btn {
  display:inline-block;
  width:40px;
  height:40px;
  margin:0 6px;
  border-radius:50%;
  background:#2196f3;
  color:#fff;
  font-size:20px;
  line-height:40px;
  cursor:pointer;
}
.num-btn.disabled {
  background:#b0bec5;
  cursor:default;
}
.control {
  text-align:center;
  margin-top:15px;
}
.btn {
  display:inline-block;
  padding:6px 12px;
  margin:0 6px;
  border-radius:6px;
  background:#4caf50;
  color:#fff;
  cursor:pointer;
  font-size:14px;
}
.btn.small {
  font-size:12px;
  padding:4px 8px;
}
#voiceExplainBtn {
  margin-top:10px;
  padding:6px 12px;
  background:#ff9800 !important;
  color:#fff !important;
  border:none !important;
  border-radius:6px;
  cursor:pointer;
}
.msg {
  text-align:center;
  margin-top:10px;
  min-height:24px;
}
.msg.ok { color:#2e7d32; }
.msg.err { color:#c62828; }

.ai-block {
  margin-top: 25px;
  padding: 15px;
  background: #e3f2fd;
  border-left: 5px solid #2196f3;
}
.ai-title {
  font-weight:bold;
  margin-bottom:8px;
}
.ai-content {
  display:none;
  margin-top:8px;
  font-size:14px;
}
.link {
  color:#1976d2;
  cursor:pointer;
  text-decoration:underline;
}

#historyArea {
  margin-top:20px;
  font-size:13px;
}
#historyArea ul {
  max-height:150px;
  overflow-y:auto;
  padding-left:20px;
}

#fireworksCanvas {
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:200px;
  pointer-events:none;
}
</style>
</head>

<body>

<h1>🎈 数学乐园 · 小学 1～6 年级 · 方格填数闯关Mini系统（2026.08.14版）</h1>

<div class="grade-select">
  <span class="grade-btn active" data-grade="1">一年级</span>
  <span class="grade-btn" data-grade="2">二年级</span>
  <span class="grade-btn" data-grade="3">三年级</span>
  <span class="grade-btn" data-grade="4">四年级</span>
  <span class="grade-btn" data-grade="5">五年级</span>
  <span class="grade-btn" data-grade="6">六年级</span>
</div>

<p id="levelTitle">一年级 · 第 1 题</p>

<div id="progressArea">
  <div id="gradeProgressText">当前年级进度：第 1 题 / 100 题</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-inner" id="gradeProgressBar"></div>
  </div>
  <div id="totalProgressText">小学阶段累计已做：0 题（目标 600～1000）</div>
</div>

<div id="statsArea">
  <span id="correctCount">正确：0</span> ·
  <span id="wrongCount">错误：0</span> ·
  <span id="accuracy">正确率：0%</span>
</div>

<p id="questionDesc">题目加载中...</p>

<div class="board">
  <canvas id="fireworksCanvas"></canvas>
  <div class="eq-row" id="eqRow"></div>
</div>

<div class="num-panel" id="numPanel"></div>

<div class="control">
  <span class="btn" id="checkBtn">检查答案</span>
  <span class="btn small" id="undoBtn">↩️ 撤销</span>
  <span class="btn" id="nextBtn">下一题 ➜</span>
  <span class="btn small" id="toggleReadBtn">🔊 读题开关</span>
  <span class="btn small" id="resetBtn">重置（清空历史与统计）</span>
</div>

<div class="msg" id="msgBox"></div>

<div class="ai-block">
  <div class="ai-title">
    AI 解题思路分析
    （<span class="link" id="toggleExplain">不会？点我讲解 / 看全部解法</span>）
  </div>
  <button id="voiceExplainBtn">🔊 AI 语音讲解</button>
  <div class="ai-content" id="aiContent"></div>
</div>

<div id="historyArea">
  <b>题目历史记录（自动保存，不随刷新消失）：</b>
  <ul id="historyList"></ul>
</div>

<script>
(function() {

let grade = 1;
let level = 1;
let currentQuestion = null;
let totalDone = 0;
let correct = 0;
let wrong = 0;
let history = [];
let undoStack = [];
let readingEnabled = true;

const eqRow = document.getElementById("eqRow");
const numPanel = document.getElementById("numPanel");
const msgBox = document.getElementById("msgBox");
const historyList = document.getElementById("historyList");
const levelTitle = document.getElementById("levelTitle");
const gradeProgressText = document.getElementById("gradeProgressText");
const gradeProgressBar = document.getElementById("gradeProgressBar");
const totalProgressText = document.getElementById("totalProgressText");
const correctCount = document.getElementById("correctCount");
const wrongCount = document.getElementById("wrongCount");
const accuracySpan = document.getElementById("accuracy");
const questionDesc = document.getElementById("questionDesc");
const aiContent = document.getElementById("aiContent");

const fireworksCanvas = document.getElementById("fireworksCanvas");
const fwCtx = fireworksCanvas.getContext("2d");

function resizeFireworks() {
  fireworksCanvas.width = fireworksCanvas.offsetWidth;
  fireworksCanvas.height = fireworksCanvas.offsetHeight;
}
resizeFireworks();
window.addEventListener("resize", resizeFireworks);

const gradeOps = {
  1: ["+", "-"],
  2: ["+", "-", "×", "÷"],
  3: ["+", "-", "×", "÷"],
  4: ["+", "-", "×", "÷"],
  5: ["+", "-", "×", "÷"],
  6: ["+", "-", "×", "÷"]
};

const baseMaxNumber = {
  1: 20,
  2: 50,
  3: 100,
  4: 200,
  5: 500,
  6: 1000
};

const maxLevelPerGrade = 100;

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function calc(a, b, op) {
  if (op === "+") return a + b;
  if (op === "-") return a - b;
  if (op === "×") return a * b;
  if (op === "÷") return b !== 0 ? a / b : 999999;
}

function updateProgressUI() {
  gradeProgressText.textContent = `当前年级进度：第 ${level} 题 / ${maxLevelPerGrade} 题`;
  const percent = Math.min(100, (level / maxLevelPerGrade) * 100);
  gradeProgressBar.style.width = percent + "%";
  totalProgressText.textContent = `小学阶段累计已做：${totalDone} 题（目标 600～1000）`;

  correctCount.textContent = `正确：${correct}`;
  wrongCount.textContent = `错误：${wrong}`;
  const acc = totalDone === 0 ? 0 : Math.round((correct / totalDone) * 100);
  accuracySpan.textContent = `正确率：${acc}%`;
}

function getDynamicMaxNumber() {
  const base = baseMaxNumber[grade];
  const acc = totalDone === 0 ? 0 : correct / totalDone;
  const factor = 1 + acc * 0.5;
  return Math.floor(base * factor);
}

function generateQuestion() {
  const maxNum = getDynamicMaxNumber();
  const ops = gradeOps[grade];

  let A, B, C, D, op1, op2, left;

  while (true) {
    op1 = ops[randomInt(0, ops.length - 1)];
    op2 = ops[randomInt(0, ops.length - 1)];

    A = randomInt(1, maxNum);
    B = randomInt(1, maxNum);
    C = randomInt(1, maxNum);

    if (op1 === "÷") {
      B = randomInt(1, maxNum);
      A = B * randomInt(1, Math.max(1, Math.floor(maxNum / B)));
    }
    if (op2 === "÷") {
      C = randomInt(1, maxNum);
    }

    const first = calc(A, B, op1);
    left = calc(first, C, op2);
    D = left;

    if (!Number.isFinite(D)) continue;
    if (Math.round(D) !== D) continue;
    if (D < 1 || D > maxNum) continue;

    break;
  }

  const nums = [A, B, C, D].sort(() => Math.random() - 0.5);

  currentQuestion = { A, B, C, D, op1, op2, nums, maxNum };

  renderQuestion();
  renderAIExplain();
  undoStack = [];
  updateProgressUI();
  autoReadQuestion();
}

function renderQuestion() {
  levelTitle.textContent = `${grade} 年级 · 第 ${level} 题`;

  const numsText = currentQuestion.nums.join("、");
  questionDesc.textContent =
    `把 ${numsText} 这四个数字分别填入方格里（每个数只能用一次），使等式成立：`;

  eqRow.innerHTML = `
    <span class="square" data-pos="0"></span>
    <span class="op">${currentQuestion.op1}</span>
    <span class="square" data-pos="1"></span>
    <span class="op">${currentQuestion.op2}</span>
    <span class="square" data-pos="2"></span>
    <span class="op">=</span>
    <span class="square" data-pos="3"></span>
  `;

  numPanel.innerHTML = "";
  currentQuestion.nums.forEach(n => {
    const btn = document.createElement("div");
    btn.className = "num-btn";
    btn.textContent = n;
    btn.dataset.val = n;
    numPanel.appendChild(btn);
  });

  attachEvents();
}

function enumerateSolutions() {
  const nums = currentQuestion.nums.slice();
  const op1 = currentQuestion.op1;
  const op2 = currentQuestion.op2;
  const solutions = [];

  function permute(arr, l) {
    if (l === arr.length) {
      const A = arr[0], B = arr[1], C = arr[2], D = arr[3];
      const left = calc(calc(A, B, op1), C, op2);
      if (left === D) solutions.push(`${A} ${op1} ${B} ${op2} ${C} = ${D}`);
      return;
    }
    for (let i = l; i < arr.length; i++) {
      [arr[l], arr[i]] = [arr[i], arr[l]];
      permute(arr, l + 1);
      [arr[l], arr[i]] = [arr[i], arr[l]];
    }
  }

  permute(nums, 0);
  return Array.from(new Set(solutions));
}

function renderAIExplain() {
  const { A, B, C, D, op1, op2, maxNum } = currentQuestion;
  const sols = enumerateSolutions();

  let html = `
    <p>本题结构：<b>A ${op1} B ${op2} C = D</b></p>
    <p>一个标准答案是：<b>${A} ${op1} ${B} ${op2} ${C} = ${D}</b></p>
  `;

  if (sols.length > 1) {
    html += `<p>所有可行填法如下：</p><ul>`;
    sols.forEach(s => html += `<li>${s}</li>`);
    html += `</ul><p>像 5、6、7、8 那道题一样，本题也可能有多种正确填法。
                     <a href="https://maths3.github.io/normal.html" target="_blank" style="color:#ff9800;font-weight:bold;">
                       （点我查看原题）
                     </a>
                  </p>`;
  } else {
    html += `<p>这组数字在当前运算符下只有唯一一种正确填法。</p>`;
  }

  html += `<p>当前年级：${grade} 年级；数字范围：1 ～ ${maxNum}（根据正确率自动调整）。</p>`;

  aiContent.innerHTML = html;
}

/* 数字飞入动画 */
function animateFly(btn, targetSquare, onDone) {
  const rectBtn = btn.getBoundingClientRect();
  const rectSq = targetSquare.getBoundingClientRect();

  const fly = document.createElement("div");
  fly.textContent = btn.textContent;
  fly.style.position = "fixed";
  fly.style.left = rectBtn.left + "px";
  fly.style.top = rectBtn.top + "px";
  fly.style.width = rectBtn.width + "px";
  fly.style.height = rectBtn.height + "px";
  fly.style.borderRadius = "50%";
  fly.style.background = "#ff9800";
  fly.style.color = "#fff";
  fly.style.display = "flex";
  fly.style.alignItems = "center";
  fly.style.justifyContent = "center";
  fly.style.zIndex = 9999;
  fly.style.transition = "all 0.3s ease-out";
  document.body.appendChild(fly);

  requestAnimationFrame(() => {
    fly.style.left = rectSq.left + "px";
    fly.style.top = rectSq.top + "px";
    fly.style.width = rectSq.width + "px";
    fly.style.height = rectSq.height + "px";
    fly.style.borderRadius = "8px";
  });

  setTimeout(() => {
    document.body.removeChild(fly);
    onDone && onDone();
  }, 320);
}

/* 烟花动画（简单版） */
let fireworks = [];
let fwRunning = false;

function spawnFirework() {
  const x = Math.random() * fireworksCanvas.width;
  const y = Math.random() * fireworksCanvas.height * 0.6;
  const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
  const particles = [];
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1
    });
  }
  fireworks.push({ particles, color });
}

function drawFireworks() {
  fwCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
  fireworks.forEach(fw => {
    fwCtx.fillStyle = fw.color;
    fw.particles.forEach(p => {
      fwCtx.globalAlpha = p.alpha;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      fwCtx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.02;
    });
  });
  fireworks = fireworks.filter(fw => fw.particles.some(p => p.alpha > 0));
}

function loopFireworks() {
  if (!fwRunning) return;
  drawFireworks();
  requestAnimationFrame(loopFireworks);
}

function playFireworks() {
  spawnFirework();
  fwRunning = true;
  loopFireworks();
  setTimeout(() => {
    fwRunning = false;
  }, 1200);
}

/* 事件绑定 */
function attachEvents() {
  const squares = Array.from(document.querySelectorAll(".square"));
  const numBtns = Array.from(document.querySelectorAll(".num-btn"));

  numBtns.forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains("disabled")) return;

      const emptySquare = squares.find(sq => sq.textContent === "");
      if (!emptySquare) return;

      animateFly(btn, emptySquare, () => {
        emptySquare.textContent = btn.dataset.val;
        btn.classList.add("disabled");
        undoStack.push({ square: emptySquare, btn });
      });
    };
  });

  document.getElementById("checkBtn").onclick = () => {
    const vals = squares.map(sq => sq.textContent);
    if (vals.some(v => v === "")) {
      showMsg("请先把方格填满哦～", false);
      return;
    }

    const A = parseInt(vals[0]);
    const B = parseInt(vals[1]);
    const C = parseInt(vals[2]);
    const D = parseInt(vals[3]);

    const left = calc(calc(A, B, currentQuestion.op1), C, currentQuestion.op2);

    totalDone++;

    const rec = {
      grade,
      level,
      expr: `${A} ${currentQuestion.op1} ${B} ${currentQuestion.op2} ${C} = ${D}`,
      correct: left === D
    };

    history.unshift(rec);
    if (history.length > 100) history.pop();
    localStorage.setItem("math_history_full", JSON.stringify(history));
    renderHistory();

    if (left === D) {
      correct++;
      showMsg("🎉 正确！进入下一题～", true);
      playFireworks();
      level++;
    } else {
      wrong++;
      showMsg(`❌ 错误：${A} ${currentQuestion.op1} ${B} ${currentQuestion.op2} ${C} ≠ ${D}`, false);
    }

    updateProgressUI();
  };

  document.getElementById("nextBtn").onclick = () => {
    level++;
    msgBox.textContent = "";
    msgBox.className = "msg";
    undoStack = [];
    generateQuestion();
  };

  document.getElementById("undoBtn").onclick = () => {
    if (undoStack.length === 0) {
      alert("没有可撤销的步骤了");
      return;
    }
    const last = undoStack.pop();
    last.square.textContent = "";
    last.btn.classList.remove("disabled");
  };
}

/* 提示消息 */
function showMsg(text, ok) {
  msgBox.textContent = text;
  msgBox.className = "msg " + (ok ? "ok" : "err");
}

/* 历史记录 */
function renderHistory() {
  historyList.innerHTML = "";
  history.forEach(h => {
    const li = document.createElement("li");
    li.textContent = `${h.grade}年级·第${h.level}题：${h.expr} —— ${h.correct ? "✅ 正确" : "❌ 错误"}`;
    historyList.appendChild(li);
  });
}

/* 重置按钮 */
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("确定要清空历史记录与统计吗？")) return;

  history = [];
  localStorage.removeItem("math_history_full");
  renderHistory();

  level = 1;
  totalDone = 0;
  correct = 0;
  wrong = 0;
  undoStack = [];

  updateProgressUI();
  generateQuestion();
};

/* AI 讲解开关 */
document.getElementById("toggleExplain").onclick = () => {
  aiContent.style.display = aiContent.style.display === "block" ? "none" : "block";
};

/* 自动读题开关 */
document.getElementById("toggleReadBtn").onclick = () => {
  readingEnabled = !readingEnabled;

  if (!readingEnabled) {
    speechSynthesis.cancel();
    alert("🔇 已关闭自动读题");
  } else {
    alert("🔊 已开启自动读题");
    autoReadQuestion();
  }
};

function autoReadQuestion() {
  if (!readingEnabled || !currentQuestion) return;

  const { op1, op2 } = currentQuestion;
  const text = `请听题：方格填数。第 ${grade} 年级，第 ${level} 题。请用下面的四个数字填入方格，使得：空格 ${op1} 空格 ${op2} 空格 等于 空格。`;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  speechSynthesis.speak(u);
}

/* AI 语音讲解 */
document.getElementById("voiceExplainBtn").onclick = () => {
  const { A, B, C, D, op1, op2 } = currentQuestion;

  const text = `
    当前是第 ${grade} 年级，第 ${level} 题。
    运算结构是：A ${op1} B ${op2} C 等于 D。
    一个标准答案是：${A} ${op1} ${B} ${op2} ${C} 等于 ${D}。
    有些题像 5、6、7、8 那道题一样，有多种不同的填法。
  `;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  speechSynthesis.speak(u);
};

/* 年级切换 */
const gradeBtns = document.querySelectorAll(".grade-btn");
gradeBtns.forEach(btn => {
  btn.onclick = () => {
    gradeBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    grade = parseInt(btn.dataset.grade);
    level = 1;
    totalDone = 0;
    correct = 0;
    wrong = 0;
    undoStack = [];

    msgBox.textContent = "";
    msgBox.className = "msg";

    updateProgressUI();
    generateQuestion();
  };
});

/* 读取历史记录 */
const saved = localStorage.getItem("math_history_full");
if (saved) {
  try {
    history = JSON.parse(saved);
    renderHistory();
  } catch (e) {}
}

/* 初始化 */
generateQuestion();

})();
</script>

</body>
</html>
