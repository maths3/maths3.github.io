<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🎮 数学乐园 · 扑克牌 24 点 · math-practice_0004 · 新布局</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui;background:#f5f7fb;margin:0;}
header{background:#4b7bec;color:#fff;padding:12px 16px;text-align:center;}
main{max-width:760px;margin:16px auto;padding:0 12px;}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06);margin-bottom:16px;}
.num-btn{padding:6px;background:#dfe8ff;border:2px solid #4b7bec;border-radius:8px;margin:6px;cursor:pointer;}
.num-btn.disabled{background:#e8e8e8;border-color:#bfbfbf;cursor:not-allowed;}
.op-btn{padding:6px;background:#f0e9ff;border:1px solid #c7b7ff;border-radius:6px;margin:4px;cursor:pointer;}
.btn-primary{background:#4b7bec;color:#fff;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;}
.btn-secondary{background:#e1e6f5;color:#333;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;}
#expr{width:30%;padding:12px;font-size:20px;border-radius:10px;border:2px solid #4b7bec;}
#timerBar{width:100%;height:8px;background:#e1e6f5;border-radius:6px;overflow:hidden;margin-top:10px;}
#timerInner{height:100%;width:100%;background:#4b7bec;transition:width 1s linear;}
.small-tip{font-size:13px;color:#666;}
.ai-link{color:#4b7bec;cursor:pointer;text-decoration:underline;font-size:14px;}
.firework{position:fixed;width:6px;height:6px;background:#ffdd57;border-radius:50%;animation:explode .8s ease-out forwards;}
@keyframes explode{from{transform:scale(1);opacity:1;}to{transform:scale(8);opacity:0;}}
.num-row, .op-row{
  display:flex;
  flex-wrap:nowrap; /* ← 不允许换行 */
  gap:0px;
  margin-top:12px;
  align-items:center;
  overflow-x:auto; /* ← 如果太宽，允许横向滚动 */
  justify-content:flex-start;
}

.num-btn{
  flex-shrink:0;
}

.card .op-row{
  display:flex !important;   /* ← 关键修复点 */
}

.op-btn{
  padding:4px 8px;
  font-size:16px;
  margin:4px;
}

</style>
</head>
<body>
<header>
  <h1>🎮 数学乐园 · 扑克牌 24 点</h1>
  <p>1～13 点数 · 每张牌随机花色 · 数字/扑克牌可切换</p>
</header>

<main>
<!-- 题目区 -->
<div class="card">
  <h2>题目区 <span id="difficultyTag"></span></h2>
  <div id="numArea" class="num-row"></div>
  <button class="btn-secondary" onclick="newQuestion()">🎲 换一题</button>
  <button class="btn-secondary" onclick="toggleCardMode()">🃏 切换数字/扑克牌显示</button>
  <div id="timerBar"><div id="timerInner"></div></div>
  <p class="small-tip">每个数字只能用一次，可以使用 + − × ÷ 和括号。</p>
</div>

<!-- 作答区 -->
<div class="card">
  <h2>作答区</h2>
  <input id="expr" placeholder="点击数字和符号自动输入…" />
  <div class="op-row">
    <button class="op-btn" onclick="insertOp('+')">+</button>
    <button class="op-btn" onclick="insertOp('-')">-</button>
    <button class="op-btn" onclick="insertOp('×')">×</button>
    <button class="op-btn" onclick="insertOp('÷')">÷</button>
    <button class="op-btn" onclick="insertOp('(')">(</button>
    <button class="op-btn" onclick="insertOp(')')">)</button>
</div>


  <div style="margin-top:12px;">
    <button class="btn-primary" onclick="checkExpr()">✅ 检查是否等于 24</button>
    <button class="btn-secondary" onclick="clearExpr()">🧹 清空</button>
    <button class="btn-secondary" onclick="undo()">↩️ 撤销</button>
  </div>
  <div id="status"></div>
</div>

<!-- 分享 -->
<div class="card">
  <h2>分享此题</h2>
  <button class="btn-primary" onclick="shareProblem()">📱 分享此题给朋友</button>
  <div id="qrcodeArea"></div>
</div>

<!-- AI 解题 -->
<div class="card">
  <h2>AI 解题思路分析</h2>
  <span class="ai-link" onclick="showAiExplain()">🤖 不会？点我讲解</span>
  &nbsp;&nbsp;|&nbsp;&nbsp;
  <span class="ai-link" onclick="showAllSolutions()">📚 看全部解法</span>
  <div id="aiExplain"></div>
</div>

<!-- 全部解法 -->
<div class="card">
  <h2>本题所有正确答案</h2>
  <div id="answerList">（尚未计算）</div>
</div>

<script>
let nums=[],usedButtons=[],cachedSolutions=null;
let timer=null,timerSeconds=30,timerLeft=timerSeconds;
let cardMode="number"; // number / poker

const suits=["hearts","diamonds","clubs","spades"];

function cardLabel(n){
  if(n===1) return "A";
  if(n===11) return "J";
  if(n===12) return "Q";
  if(n===13) return "K";
  return n.toString();
}

function randomCardImage(n){
  const suit=suits[Math.floor(Math.random()*4)];
  return `/cards/${suit}/${cardLabel(n)}.png`;
}

function toggleCardMode(){
  cardMode=(cardMode==="number")?"poker":"number";
  renderNums();  // 只更新题目区
}

function renderNums(){
  const area=document.getElementById("numArea");
  area.innerHTML="";
  nums.forEach((n,i)=>{
    const btn=document.createElement("button");
    btn.className="num-btn";
    btn.dataset.index=i;
    if(cardMode==="number"){
      btn.textContent=n;
    }else{
      const img=document.createElement("img");
      img.src=randomCardImage(n);
      img.style.width="60px";
      img.style.height="80px";
      img.style.borderRadius="6px";
      img.style.boxShadow="0 2px 6px rgba(0,0,0,0.2)";
      btn.appendChild(img);
    }
    btn.onclick=()=>useNumber(btn,n);
    area.appendChild(btn);
  });
}

function useNumber(btn,n){
  if(btn.classList.contains("disabled")) return;
  insertOp(n);
  btn.classList.add("disabled");
  usedButtons.push(btn);
}

function undo(){
  const e=document.getElementById("expr");
  if(usedButtons.length===0) return;
  e.value=e.value.replace(/\d+$/,"");
  const btn=usedButtons.pop();
  btn.classList.remove("disabled");
}

function insertOp(o){
  const e=document.getElementById("expr");
  e.value+=o;
}

function clearExpr(){
  document.getElementById("expr").value="";
  document.getElementById("status").innerHTML="";
}

function setStatus(msg,type){
  const s=document.getElementById("status");
  s.textContent=msg;
  s.className=type;
}

function firework(){
  for(let i=0;i<8;i++){
    const fw=document.createElement("div");
    fw.className="firework";
    fw.style.left=(Math.random()*window.innerWidth)+"px";
    fw.style.top=(Math.random()*window.innerHeight)+"px";
    document.body.appendChild(fw);
    setTimeout(()=>fw.remove(),800);
  }
}

function startTimer(){
  timerLeft=timerSeconds;
  updateTimerBar();
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    timerLeft--;
    updateTimerBar();
    if(timerLeft<=0){
      clearInterval(timer);
      setStatus("⏰ 时间到！请换一题","err");
    }
  },1000);
}

function updateTimerBar(){
  const bar=document.getElementById("timerInner");
  bar.style.width=(timerLeft/timerSeconds*100)+"%";
}

function checkExpr(){
  const raw=document.getElementById("expr").value;
  const expr=raw.replace(/×/g,"*").replace(/÷/g,"/");
  if(!expr.trim()){
    setStatus("请输入算式","err");
    return;
  }
  const used=expr.match(/\d+/g)?.map(x=>parseInt(x))||[];
  const sortedUsed=used.slice().sort((a,b)=>a-b);
  const sortedNums=nums.slice().sort((a,b)=>a-b);
  if(JSON.stringify(sortedUsed)!==JSON.stringify(sortedNums)){
    setStatus("必须使用题目给出的四个数字","err");
    return;
  }
  try{
    const val=Function("return ("+expr+")")();
    if(Math.abs(val-24)<1e-9){
      setStatus("🎉 正确！结果是 24","ok");
      firework();
    }else{
      setStatus("结果是 "+val+"，不是 24","err");
    }
  }catch{
    setStatus("表达式错误，请检查括号与运算符","err");
  }
}

function solve24All(){
  if(cachedSolutions) return cachedSolutions;
  const ops=["+","-","*","/"];
  const results=new Set();
  function calc(a,b,op){
    if(op==="+") return a+b;
    if(op==="-") return a-b;
    if(op==="*") return a*b;
    if(op==="/") return b===0?null:a/b;
  }
  const arr=nums.slice();
  const perms=[];
  for(let i=0;i<4;i++){
    for(let j=0;j<4;j++){
      if(j===i) continue;
      for(let k=0;k<4;k++){
        if(k===i||k===j) continue;
        for(let l=0;l<4;l++){
          if(l===i||l===j||l===k) continue;
          perms.push([arr[i],arr[j],arr[k],arr[l]]);
        }
      }
    }
  }
  for(const [a,b,c,d] of perms){
    for(const op1 of ops){
      for(const op2 of ops){
        for(const op3 of ops){

          let t1=calc(a,b,op1);
          if(t1!==null){
            let t2=calc(t1,c,op2);
            if(t2!==null){
              let t3=calc(t2,d,op3);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`((${a}${op1}${b})${op2}${c})${op3}${d}`);
            }
          }

          t1=calc(b,c,op2);
          if(t1!==null){
            let t2=calc(a,t1,op1);
            if(t2!==null){
              let t3=calc(t2,d,op3);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`(${a}${op1}(${b}${op2}${c}))${op3}${d}`);
            }
          }

          t1=calc(b,c,op2);
          if(t1!==null){
            let t2=calc(t1,d,op3);
            if(t2!==null){
              let t3=calc(a,t2,op1);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`${a}${op1}((${b}${op2}${c})${op3}${d})`);
            }
          }

          t1=calc(c,d,op3);
          if(t1!==null){
            let t2=calc(b,t1,op2);
            if(t2!==null){
              let t3=calc(a,t2,op1);
              if(t3!==null&&Math.abs(t3-24)<1e-9)
                results.add(`${a}${op1}(${b}${op2}(${c}${op3}${d}))`);
            }
          }

          t1=calc(a,b,op1);
          t2=calc(c,d,op3);
          if(t1!==null&&t2!==null){
            let t3=calc(t1,t2,op2);
            if(t3!==null&&Math.abs(t3-24)<1e-9)
              results.add(`(${a}${op1}${b})${op2}(${c}${op3}${d})`);
          }

        }
      }
    }
  }
  cachedSolutions=[...results].map(s=>s.replace(/\*/g,"×").replace(/\//g,"÷"));
  updateDifficulty(cachedSolutions.length);
  return cachedSolutions;
}

function updateDifficulty(count){
  const tag=document.getElementById("difficultyTag");
  let level="";
  if(count===0) level="❌ 无解题";
  else if(count<=2) level="⭐ 简单";
  else if(count<=6) level="⭐⭐ 中等";
  else if(count<=15) level="⭐⭐⭐ 困难";
  else level="⭐⭐⭐⭐ 地狱级";
  tag.textContent=level;
}

function showAiExplain(){
  const div=document.getElementById("aiExplain");
  const sols=solve24All();
  if(sols.length===0){
    div.innerHTML="❌ 这组数字无解。";
    return;
  }
  const sample=sols.slice(0,Math.min(3,sols.length));
  div.innerHTML=`<p>这道题可以这样思考：</p>
    <ul>${sample.map(s=>`<li><code>${s}</code></li>`).join("")}</ul>`;
}

function showAllSolutions(){
  const sols=solve24All();
  const list=document.getElementById("answerList");
  list.innerHTML="";
  if(sols.length===0){
    list.innerHTML="❌ 本题无解";
    return;
  }
  sols.forEach(a=>{
    const div=document.createElement("div");
    div.textContent=a;
    list.appendChild(div);
  });
}

function shareProblem(){
  const difficulty=document.getElementById("difficultyTag").textContent;
  const numbers=nums.join(", ");
  const text=`24点题目：${numbers} 难度：${difficulty}`;
  const area=document.getElementById("qrcodeArea");
  area.innerHTML="";
  const img=document.createElement("img");
  img.src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="+encodeURIComponent(text);
  img.style.marginTop="10px";
  img.style.borderRadius="6px";
  area.appendChild(img);
}

function newQuestion(){
  nums=[];
  for(let i=0;i<4;i++) nums.push(Math.floor(Math.random()*13)+1);
  usedButtons=[];
  cachedSolutions=null;
  renderNums();
  document.getElementById("expr").value="";
  document.getElementById("status").innerHTML="";
  document.getElementById("aiExplain").innerHTML="";
  document.getElementById("answerList").innerHTML="（尚未计算）";
  startTimer();
  solve24All();
}

window.onload=function(){
  newQuestion();
};
</script>
</main>
</body>
</html>
