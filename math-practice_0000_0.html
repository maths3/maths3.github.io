<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一年级下册数学《1-6的表内乘法》计算专项</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .paper {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 30px 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            color: #333;
            position: relative;
        }

        /* 顶部标题与信息栏 */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .header h1 span {
            color: #c0392b;
            display: inline-block;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .info-item {
            display: inline-flex;
            align-items: flex-end;
        }

        .underline {
            display: inline-block;
            border-bottom: 1px solid #333;
            width: 80px;
            height: 18px;
            text-align: center;
            font-weight: bold;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 顶部重置按钮样式 */
        .btn-reset-top {
            background-color: #ff4d4f;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(255, 77, 79, 0.2);
        }

        .btn-reset-top:hover {
            background-color: #d9363e;
            transform: translateY(-1px);
        }

        #timeDisplay { color: #27ae60; }
        #classDisplay { width: 110px; color: #333; }
        #nameDisplay { color: #333; }
        #scoreDisplay { color: #e74c3c; }

        /* 得分面板看板 */
        .score-board {
            display: none;
            background-color: #f8f9fa;
            border: 2px dashed #27ae60;
            border-radius: 8px;
            padding: 15px 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .score-board.active { display: block; }

        .score-board .score-num {
            font-size: 30px;
            font-weight: bold;
            color: #e74c3c;
            margin: 0 5px;
        }

        .score-details {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 题目章节样式 */
        .section { margin-bottom: 25px; }

        .section-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
            padding-left: 8px;
        }

        /* 题目网格布局 */
        .math-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 16px;
            column-gap: 12px;
        }

        .math-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 500;
            background-color: #fafafa;
            padding: 6px 8px;
            border-radius: 4px;
        }

        .expression { white-space: nowrap; }

        .answer-input {
            width: 55px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        .answer-input:focus {
            border-color: #3498db;
            box-shadow: 0 0 4px rgba(52, 152, 219, 0.3);
            background-color: #fff;
        }

        .answer-input.correct {
            border-color: #27ae60;
            background-color: #e8f8f5;
            color: #27ae60;
            font-weight: bold;
        }

        .answer-input.wrong {
            border-color: #e74c3c;
            background-color: #fadbd8;
            color: #c0392b;
            font-weight: bold;
        }

        /* 操作按钮 */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: opacity 0.2s;
            flex: 1;
            max-width: 160px;
        }

        .btn:hover { opacity: 0.9; }
        .btn-submit { background-color: #27ae60; }
        .btn-refresh { background-color: #2980b9; }

        .footer {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        /* -------------------------------------------------------------
           ✨ 精致专业版 姓名班级弹窗样式
        ------------------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.55); /* 沉浸式深色背景 */
            backdrop-filter: blur(8px); /* 磨砂玻璃效果 */
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 18px;
            padding: 28px 24px 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 顶部装饰彩条 */
        .modal-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #10b981);
        }

        /* 弹窗小图标 */
        .modal-icon {
            width: 52px;
            height: 52px;
            background: #eff6ff;
            color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px;
        }

        .modal-card h3 {
            font-size: 19px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 22px;
        }

        .modal-field {
            margin-bottom: 16px;
            text-align: left;
        }

        .modal-field label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 6px;
        }

        .modal-field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        .modal-field input:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(59, 130, 246, 0.15);
        }

        .modal-field input::placeholder {
            color: #94a3b8;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: all 0.2s ease;
        }

        .btn-start:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        .btn-start:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2);
        }

        /* 弹出动画 */
        @keyframes modalPop {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @media (max-width: 768px) {
            .math-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            body { padding: 10px 5px; }
            .paper { padding: 20px 15px; }
            .header h1 { font-size: 19px; }
            .info-bar {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                row-gap: 8px;
                font-size: 14px;
            }
            .underline { width: 70px; }
            #classDisplay { width: 95px; }
            .math-grid { grid-template-columns: 1fr; row-gap: 10px; }
            .math-item { padding: 8px 12px; }
            .answer-input { width: 70px; height: 34px; }
        }

        @media print {
            body { background: none; padding: 0; }
            .paper { box-shadow: none; width: 100%; padding: 0; }
            .actions, .score-board, .modal-overlay, .btn-reset-top { display: none !important; }
            .math-grid { grid-template-columns: repeat(4, 1fr) !important; }
            .answer-input {
                border: none;
                border-bottom: 1px solid #000;
                border-radius: 0;
                background: transparent !important;
            }
        }
    </style>
</head>
<body>

<!-- 精致版 姓名班级输入弹窗 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div class="modal-icon">✏️</div>
        <h3>欢迎来到算数练习</h3>
        <p class="modal-subtitle">请填写信息以记录答题与成绩</p>
        
        <div class="modal-field">
            <label for="inputClass">班级</label>
            <input type="text" id="inputClass" placeholder="例如：一年级1班" autocomplete="off">
        </div>
        <div class="modal-field">
            <label for="inputName">姓名</label>
            <input type="text" id="inputName" placeholder="请输入你的姓名" autocomplete="off">
        </div>
        <button class="btn-start" onclick="confirmAndStart()">确定并开始计时</button>
    </div>
</div>

<div class="paper">
    <!-- 顶部信息 -->
    <div class="header">
        <h1>一年级下册数学<br><span>《1-6的表内乘法》</span>计算专项</h1>
        <div class="info-bar">
            <div class="info-item">姓名：<span class="underline" id="nameDisplay"></span></div>
            <div class="info-item">用时：<span class="underline" id="timeDisplay">00:00</span></div>
            <div class="info-item">班级：<span class="underline" id="classDisplay"></span></div>
            <div class="info-item">成绩：<span class="underline" id="scoreDisplay"></span></div>
            <button class="btn-reset-top" onclick="resetLocalStorage()">🗑️ 重置数据</button>
        </div>
    </div>

    <!-- 成绩批改面板 -->
    <div class="score-board" id="scoreBoard">
        <div>得分：<span class="score-num" id="totalScore">0</span> 分</div>
        <div class="score-details">
            <span style="color:#27ae60;">✔ 答对：<b id="correctCount">0</b> 题</span>
            <span style="color:#e74c3c;">✘ 答错：<b id="wrongCount">0</b> 题</span>
            <span style="color:#e67e22;">? 未作答：<b id="unansweredCount">0</b> 题</span>
        </div>
    </div>

    <!-- 第一部分：乘加乘减 -->
    <div class="section">
        <div class="section-title">一、6以内乘加乘减两位数</div>
        <div class="math-grid" id="gridPart1"></div>
    </div>

    <!-- 第二部分：6以内的乘法 -->
    <div class="section">
        <div class="section-title">二、6以内的乘法</div>
        <div class="math-grid" id="gridPart2"></div>
    </div>

    <!-- 交互按钮 -->
    <div class="actions">
        <button class="btn btn-refresh" onclick="handleRefresh()">刷新题目</button>
        <button class="btn btn-submit" onclick="submitAnswers()">提交答案</button>
    </div>

    <!-- 页码 -->
    <div class="footer">
        第<span id="currentPage">1</span>页，共1000000页
    </div>
</div>

<script>
    let currentPage = 1;
    const maxPage = 10000000;
    
    let timerInterval = null;
    let secondsElapsed = 0;
    let isStarted = false;

    window.onload = function() {
        const savedClass = localStorage.getItem('math_practice_class');
        const savedName = localStorage.getItem('math_practice_name');

        if (savedClass) {
            document.getElementById('inputClass').value = savedClass;
            document.getElementById('classDisplay').textContent = savedClass;
        }
        if (savedName) {
            document.getElementById('inputName').value = savedName;
            document.getElementById('nameDisplay').textContent = savedName;
        }

        if (savedName) {
            document.getElementById('modalOverlay').style.display = 'none';
            isStarted = true;
            startTimer();
        }

        generatePart1();
        generatePart2();
    };

    function formatTime(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const formattedMins = mins < 10 ? '0' + mins : mins;
        const formattedSecs = secs < 10 ? '0' + secs : secs;
        return `${formattedMins}:${formattedSecs}`;
    }

    function confirmAndStart() {
        const className = document.getElementById('inputClass').value.trim();
        const name = document.getElementById('inputName').value.trim();

        if (!name) {
            alert("请输入姓名后再开始！");
            return;
        }

        localStorage.setItem('math_practice_class', className);
        localStorage.setItem('math_practice_name', name);

        document.getElementById('classDisplay').textContent = className;
        document.getElementById('nameDisplay').textContent = name;
        document.getElementById('modalOverlay').style.display = 'none';

        isStarted = true;
        startTimer();
    }

    function resetLocalStorage() {
        if (confirm("确定要重置本地数据（清空保存的姓名和班级）吗？")) {
            localStorage.clear();
            location.reload();
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsElapsed = 0;
        document.getElementById('timeDisplay').textContent = "00:00";
        
        timerInterval = setInterval(() => {
            secondsElapsed++;
            document.getElementById('timeDisplay').textContent = formatTime(secondsElapsed);
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generatePart1() {
        const container = document.getElementById('gridPart1');
        container.innerHTML = '';
        
        const usedKeySet = new Set();
        let count = 0;

        while (count < 36) {
            const a = getRandomInt(1, 6);
            const b = getRandomInt(1, 6);
            const isPlus = Math.random() > 0.5;
            let c, opSymbol, answer;

            if (isPlus) {
                c = getRandomInt(10, 50);
                opSymbol = '+';
                answer = a * b + c;
            } else {
                const product = a * b;
                c = getRandomInt(10, 30);
                if (product >= c) {
                    opSymbol = '−';
                    answer = product - c;
                } else {
                    opSymbol = '+';
                    answer = product + c;
                }
            }

            const uniqueKey = `${a}x${b}${opSymbol}${c}`;

            if (!usedKeySet.has(uniqueKey)) {
                usedKeySet.add(uniqueKey);

                const exprText = `${a} × ${b} ${opSymbol} ${c} =`;
                const item = document.createElement('div');
                item.className = 'math-item';
                item.innerHTML = `<span class="expression">${exprText}</span><input type="number" pattern="[0-9]*" class="answer-input" data-answer="${answer}">`;
                container.appendChild(item);
                
                count++;
            }
        }
    }

    function generatePart2() {
        const container = document.getElementById('gridPart2');
        container.innerHTML = '';

        const pool = [];
        for (let a = 1; a <= 6; a++) {
            for (let b = 1; b <= 6; b++) {
                pool.push({ a, b, answer: a * b });
            }
        }

        shuffle(pool);

        pool.forEach(itemData => {
            const item = document.createElement('div');
            item.className = 'math-item';
            item.innerHTML = `<span class="expression">${itemData.a} × ${itemData.b} =</span><input type="number" pattern="[0-9]*" class="answer-input" data-answer="${itemData.answer}">`;
            container.appendChild(item);
        });
    }

    function handleRefresh() {
        generatePart1();
        generatePart2();

        currentPage = currentPage >= maxPage ? 1 : currentPage + 1;
        document.getElementById('currentPage').textContent = currentPage;

        document.getElementById('scoreBoard').classList.remove('active');
        document.getElementById('scoreDisplay').textContent = '';

        if (isStarted) {
            startTimer();
        } else {
            document.getElementById('modalOverlay').style.display = 'flex';
        }
    }

    function submitAnswers() {
        if (!isStarted) {
            alert("请先填写姓名班级并点击确定开始！");
            return;
        }

        stopTimer();

        const inputs = document.querySelectorAll('.answer-input');
        let correctCount = 0;
        let wrongCount = 0;
        let unansweredCount = 0;
        const totalQuestions = inputs.length;

        inputs.forEach(input => {
            const userAnswer = input.value.trim();
            const correctAnswer = input.getAttribute('data-answer');

            input.classList.remove('correct', 'wrong');

            if (userAnswer === '') {
                unansweredCount++;
                input.classList.add('wrong');
            } else if (userAnswer === correctAnswer) {
                correctCount++;
                input.classList.add('correct');
            } else {
                wrongCount++;
                input.classList.add('wrong');
            }
        });

        const score = Math.round((correctCount / totalQuestions) * 100);

        document.getElementById('totalScore').textContent = score;
        document.getElementById('scoreDisplay').textContent = score + " 分";
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('wrongCount').textContent = wrongCount;
        document.getElementById('unansweredCount').textContent = unansweredCount;

        document.getElementById('scoreBoard').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
